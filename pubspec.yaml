name: lost_found_app
description: A complete Lost & Found app using Flutter and Firebase
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.10.3
  uuid: ^4.0.0

  # State Management
  flutter_riverpod: ^2.5.0

  # Utilities & UI
  image_picker: ^1.0.7
  intl: ^0.19.0
  url_launcher: ^6.3.0
  path: ^1.9.0

  # Modern UI & Animations
  shimmer: ^3.0.0
  lottie: ^3.1.0
  google_fonts: ^6.1.0
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0

  # Icons
  cupertino_icons: ^1.0.8
  mockito: ^5.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.3.10
  build_runner: ^2.10.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/app_logo.png
    - assets/images/splash_logo.png
    - assets/images/splash_background.png

